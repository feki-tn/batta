<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>إنشاء مزاد - بتة</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; min-height: 100vh; }
    header, footer { background: #fff; padding: 1rem 2rem; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    header { display: flex; justify-content: flex-start; align-items: center; } /* Left align the header */
    header h1 { color: #007bff; font-size: 1.8rem; margin: 0; }
    nav { display: flex; justify-content: flex-start; width: 100%; }
    nav a { margin-left: 15px; text-decoration: none; color: #333; font-weight: bold; }
    main { flex: 1; display: flex; justify-content: center; align-items: center; }
    .form-container { background: #fff; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 8px; width: 300px; }
    input[type='text'], input[type='password'] { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; }
    button { padding: 12px 20px; width: 100%; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    footer { text-align: center; margin-top: auto; box-shadow: 0 -2px 5px rgba(0,0,0,0.05); }
  </style>
</head>
<body>
  <header>
    <h1>بتة</h1>
    <nav>
      <div class="nav-links">
        <a href="index.html">الرئيسية</a>
        <a href="my-listings.html">قائمتي</a>
        <a href="profile.html">الملف الشخصي</a>
        <a href="logout">تسجيل الخروج</a>
      </div>
    </nav>
  </header>

  <main class="form-wrapper">
    <h2>إنشاء مزاد جديد</h2>
    <form action="create-listing" method="post" class="form-box">
      <label for="name">اسم المزاد</label>
      <input type="text" id="name" name="name" required />

      <label for="link">رابط المنتج</label>
      <input type="url" id="link" name="link" required />

      <label for="type">نوع المزاد</label>
      <select id="type" name="type" required>
        <option value="">اختر نوع المزاد</option>
        <option value="sealed">مزاد سري (مزايدة واحدة)</option>
        <option value="open">مزاد علني (عدة مزايدات)</option>
      </select>

      <label for="endDate">تاريخ الانتهاء</label>
      <input type="datetime-local" id="endDate" name="endDate" required />
		
	<label for="endDate">السعر الافتتاحي</label>
      <input type="number" id="price" name="price" required />
      <button type="submit">إنشاء</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 بتة</p>
  </footer>
</body>
</html>
